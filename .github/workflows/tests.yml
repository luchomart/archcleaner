name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Dependencias
        run: pacman -Syu --noconfirm python python-rich python-textual glib2 git
      - uses: actions/checkout@v4
      - name: Usuario sin privilegios (ArchCleaner no corre como root)
        run: useradd -m prueba && chown -R prueba .
      - name: Tests
        run: su prueba -c "python -m unittest discover -s tests -v"
